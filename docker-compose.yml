version: '3.8'

services:
  genshinquiz-backend:
    container_name: genshinquiz-backend
    build: .
    restart: unless-stopped
    ports:
      - "8091:8080"
    env_file:
      - .env.production
    environment:
      - ENVIRONMENT=production
      - DATABASE_NAME=genshinquiz
      - DATABASE_URL=postgres://postgres:postgres@postgres-1:5432/genshinquiz?sslmode=disable
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 15s
    networks:
      - moelink-net

networks:
  moelink-net:
    external: true
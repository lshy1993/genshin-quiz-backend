steps:
  # 1. 构建后端镜像
  - name: "gcr.io/cloud-builders/docker"
    id: "Build Backend Image"
    args:
      [
        "build",
        "-t",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA",
        "./repos/backend",
      ]

  # 1.5 推送镜像到 Artifact Registry（确保下一步可顺利拉取或调用）
  - name: "gcr.io/cloud-builders/docker"
    id: "Push Backend Image"
    args:
      [
        "push",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA",
      ]

  # 2. 执行数据库迁移
  - name: "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA"
    id: "Run Database Migrations"
    entrypoint: "./goose"
    args: ["-dir", "./migrations", "postgres", "$$DATABASE_URL", "up"]
    secretEnv: ["DATABASE_URL"] # 推荐结合 Secret Manager 使用，比普通环境变量更安全

  # 3. 部署到 Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Deploy to Cloud Run"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "genshinquiz-backend",
        "--image",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA",
        "--region",
        "asia-northeast1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--add-cloudsql-instances=$_CLOUD_SQL_CONNECTION_NAME",
        "--port",
        "8080",
      ]

images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY

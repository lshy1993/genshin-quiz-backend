steps:
  # 第一步：构建后端镜像 (使用您刚才写的那个优秀的多阶段 Dockerfile)
  - name: "gcr.io/cloud-builders/docker"
    id: "Build Backend Image"
    args:
      [
        "build",
        "-t",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA",
        "./repos/backend",
      ]

  # 第二步：执行数据库迁移
  - name: "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA"
    id: "Run Database Migrations"
    # 注意：我们直接运行镜像里的 goose
    entrypoint: "./goose"
    args: [
        "-dir",
        "./migrations",
        "postgres",
        "$$DATABASE_URL", # 注意这里的双美金符号，用于转义
        "up",
      ]
    env:
      - "DATABASE_URL=$_DATABASE_URL"

  # 第三步：部署到 Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Deploy to Cloud Run"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "genshinquiz-backend",
        "--image",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA",
        "--region",
        "asia-northeast1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--add-cloudsql-instances=$_CLOUD_SQL_CONNECTION_NAME",
      ]

# 将镜像推送到 Artifact Registry
images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING

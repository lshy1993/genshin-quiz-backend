steps:
  # 1. 构建后端镜像
  - name: "gcr.io/cloud-builders/docker"
    id: "Build Backend Image"
    env:
      - "DOCKER_BUILDKIT=1" # 👈 启用 BuildKit 引擎
    args:
      [
        "build",
        "-t",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA",
        ".",
      ]

  # 1.5 推送镜像到 Artifact Registry（确保下一步可顺利拉取或调用）
  - name: "gcr.io/cloud-builders/docker"
    id: "Push Backend Image"
    args:
      [
        "push",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA",
      ]

  # 2. 执行数据库迁移
  - name: "ghcr.io/pressly/goose/v3:latest"
    id: "Run Database Migrations"
    entrypoint: "goose"
    args: ["-dir", "./migrations", "postgres", "$$DATABASE_URL", "up"]
    secretEnv: ["DATABASE_URL"]

  # 3. 部署到 Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Deploy to Cloud Run"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "genshinquiz-backend",
        "--image",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA",
        "--region",
        "asia-northeast1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--add-cloudsql-instances=$_CLOUD_SQL_CONNECTION_NAME",
        "--port",
        "8080",
        "--set-env-vars",
        "PORT=8080,ENVIRONMENT=production,APP_DOMAIN=$_APP_DOMAIN,DATABASE_HOST=$_DATABASE_HOST,DATABASE_PORT=$_DATABASE_PORT,DATABASE_NAME=$_DATABASE_NAME",
        "--set-secrets",
        "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,SENTRY_DSN=SENTRY_DSN:latest,RESEND_KEY=RESEND_KEY:latest",
      ]

images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: "DATABASE_URL"

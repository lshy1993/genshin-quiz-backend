steps:
  # 0. 尝试拉取最新的镜像作为缓存源（如果不存在则忽略错误继续）
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      [
        "-c",
        "docker pull asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:latest || exit 0",
      ]
  # 1. 构建后端镜像（开启 BuildKit 与镜像层缓存）
  - name: "gcr.io/cloud-builders/docker"
    id: "Build Backend Image"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      [
        "build",
        "--build-arg",
        "BUILDKIT_INLINE_CACHE=1",
        "--cache-from",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:latest",
        "-t",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA",
        "-t",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:latest",
        ".",
      ]

  # 1.5 推送镜像到 Artifact Registry（确保下一步可顺利拉取或调用）
  - name: "gcr.io/cloud-builders/docker"
    id: "Push Backend Image"
    entrypoint: "bash"
    args:
      [
        "-c",
        "docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA && docker push asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:latest",
      ]

  # 2. 部署到 Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Deploy to Cloud Run"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "genshinquiz-backend",
        "--image",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA",
        "--region",
        "asia-northeast1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--add-cloudsql-instances=project-9f1e9b8a-2bd5-43d2-a59:asia-northeast1:genshinquiz-db",
        "--set-env-vars",
        "ENVIRONMENT=production,APP_DOMAIN=$_APP_DOMAIN,DATABASE_HOST=$_DATABASE_HOST,DATABASE_PORT=$_DATABASE_PORT,DATABASE_NAME=$_DATABASE_NAME",
        "--set-secrets",
        "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,SENTRY_DSN=SENTRY_DSN:latest,RESEND_KEY=RESEND_KEY:latest",
      ]

images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:$COMMIT_SHA"
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/genshinquiz-backend:latest"

options:
  logging: CLOUD_LOGGING_ONLY
